services:
  api:
    image: apex-operations-api:v1
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app_user:${POSTGRES_PASSWORD}@db:5432/operations_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: operations_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d operations_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
